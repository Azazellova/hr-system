events { worker_connections 1024; }
http {
  upstream employee_api { server employee-service:8082; }
  upstream organization_api { server organization-service:8083; }
  upstream hr_api { server hr-service:8084; }
  upstream document_api { server document-service:8085; }
  server {
    listen 8080;
    location /employees { proxy_pass http://employee_api; }
    location /departments { proxy_pass http://organization_api; }
    location /positions { proxy_pass http://organization_api; }
    location /hr/ { proxy_pass http://hr_api; }
    location /api/ { proxy_pass http://document_api; }
    location /swagger/ { return 404; }
  }
}
