server:
  port: ${SERVER_PORT:8083}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://organization-db:5432/organization_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
