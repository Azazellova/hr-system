server:
  port: ${SERVER_PORT:8084}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://hr-db:5432/hr_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
clients:
  employee:
    url: ${EMPLOYEE_SERVICE_URL:http://employee-service:8082}
  organization:
    url: ${ORGANIZATION_SERVICE_URL:http://organization-service:8083}
  document:
    url: ${DOCUMENT_SERVICE_URL:http://document-service:8085}
company:
  name: ${COMPANY_NAME:ООО «Вектор»}
accounting:
  mock-salaries: "{'201': 220000, '202': 165000, '203': 140000, '204': 115000, '205': 170000, '206': 130000, '207': 110000, '208': 145000, '209': 105000, '210': 95000, '211': 90000, '212': 85000, '213': 125000, '214': 100000, '215': 180000}"
