services:
  employee-db:
    image: postgres:15
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["5433:5432"]
    volumes: [employee_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  organization-db:
    image: postgres:15
    environment:
      POSTGRES_DB: organization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["5434:5432"]
    volumes: [organization_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d organization_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  hr-db:
    image: postgres:15
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["5435:5432"]
    volumes: [hr_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  document-db:
    image: postgres:15
    environment:
      POSTGRES_DB: document_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["5436:5432"]
    volumes: [document_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  employee-service:
    build:
      context: .
      dockerfile: services/employee-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://employee-db:5432/employee_db
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["8082:8082"]
    depends_on:
      employee-db:
        condition: service_healthy
  organization-service:
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://organization-db:5432/organization_db
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["8083:8083"]
    depends_on:
      organization-db:
        condition: service_healthy
  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://document-db:5432/document_db
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["8085:8085"]
    depends_on:
      document-db:
        condition: service_healthy
  hr-service:
    build:
      context: .
      dockerfile: services/hr-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://hr-db:5432/hr_db
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      EMPLOYEE_SERVICE_URL: http://employee-service:8082
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
      DOCUMENT_SERVICE_URL: http://document-service:8085
      COMPANY_NAME: "${COMPANY_NAME}"
    ports: ["8084:8084"]
    depends_on:
      hr-db:
        condition: service_healthy
      employee-service:
        condition: service_started
      organization-service:
        condition: service_started
      document-service:
        condition: service_started
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [employee-service, organization-service, hr-service, document-service]
volumes:
  employee_data:
  organization_data:
  hr_data:
  document_data:
